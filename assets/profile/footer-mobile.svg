<svg xmlns="http://www.w3.org/2000/svg" width="600" height="120" viewBox="0 0 600 120" role="img" aria-label="Build quietly. Learn relentlessly. Ship intelligently."><title>Build quietly. Learn relentlessly. Ship intelligently.</title><g font-family="Segoe UI, Arial, sans-serif"><path d="M0 1H600" stroke="#292d40"/><text x="300" y="48" font-size="20" fill="#a6abc1" font-weight="500" text-anchor="middle" letter-spacing="1">BUILD QUIETLY. LEARN RELENTLESSLY.</text><text x="300" y="84" font-size="20" fill="#a6abc1" font-weight="500" text-anchor="middle" letter-spacing="1">SHIP INTELLIGENTLY.</text></g></svg>